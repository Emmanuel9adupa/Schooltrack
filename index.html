<script>
const $=s=>document.querySelector(s),UGX=n=>'UGX '+Math.round(n).toLocaleString('en-US'),FEE=450000,DUE=new Date('2026-10-29'),NOW=new Date(),TD=NOW.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
let D,role=null,view='dash',online=true,sel=1,cls='P5 Blue',mk={},sm=null,us='Dial *123# to start.',q='';
const P='P'.repeat(20),tr=k=>P.slice(k)+'A'.repeat(k),sc=k=>{const a=P.split('');for(let i=0;i<k;i++)a[i*3+1]='A';return a.join('')};
const paid=l=>l.pay.reduce((s,p)=>s+p.a,0),L=id=>D.L.find(l=>l.id==id),gd=l=>{const g=D.G&&D.G.find(x=>x.id==l.gid);return g?g.n:'Mrs. '+l.n.split(' ')[0]},gph=l=>{const g=D.G&&D.G.find(x=>x.id==l.gid);return g?g.ph.replace(/(\d{4})(\d{3})(\d{3})/,'$1 $2 $3'):'—'};

const msg=(l,r)=>'SchoolTrack ALERT ('+(r.f=='RED'?'Red':'Amber')+'): '+l.n+' ('+l.c+') '+[r.A_&&'is absent '+(r.st>=D.cfg.days?r.st+' days in a row':r.n+' of the last 20 days'),r.F_&&r.un+'% of fees are overdue',r.C_&&'has a concern raised by a teacher ('+l.cn.t+')'].filter(Boolean).join(' and ')+'. Please contact the school.';

].filter(x=>x.d>=s&&(x.e||x.d)<=e).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0)}
const chkT=(n,s,e,du)=>!n||!s||!e||!du?'Fill in the term name and all three dates.':e<=s?'The closing date must be after the opening date.':du<s||du>e?'The fee due date must be between the opening and closing dates.':'';
function saveTerm(){const n=$('#tn').value.trim(),s=$('#ts').value,e=$('#te').value,du=$('#td').value,m=chkT(n,s,e,du);if(m)return T(m);D.term={name:n,start:s,end:e,due:du};D.ev=genEv(s,e,du);save();T('Term dates saved');render()}
function askTerm(){const n=$('#xn').value.trim(),s=$('#xs').value,e=$('#xe').value,du=$('#xd').value,m=chkT(n,s,e,du);if(m)return T(m);ct={n,s,e,du};render()}

function vCal(){const t=D.term,td=iso(NOW),tot=Math.ceil((dBetween(t.start,t.end)+1)/7),wk=Math.min(tot,Math.max(1,Math.floor(dBetween(t.start,td)/7)+1)),

const setup=role=='ht'?`<div class="two2"><div class="card"><h3>This term’s dates</h3><label for="tn">Term name</label><input id="tn" value="${esc(t.name)}"><div class="two2"><div><label for="ts">Opening date</label><input id="ts" type="date" value="${t.start}"></div><div><label for="te">Closing date</label><input id="te" type="date" value="${t.end}"></div></div><label for="td">Fee due date</label><input id="td" type="date" value="${t.due}"><p class="m">Saving rebuilds the calendar below and moves the fee due date used by the early-warning rule.</p><div class="row"><button onclick="saveTerm()">Save dates</button></div></div><div class="card"><h3>Start a new term</h3>${ct?`<div class="ban off">Start <b>${esc(ct.n)}</b>, ${fdS(ct.s)} to ${fdS(ct.e)}, fees due ${fdS(ct.du)}? This archives the payments of ${esc(t.name)}, resets every register and invoice, and clears teacher concerns and the alert log. Learners, classes and guardian logins stay. Every guardian gets an SMS with the dates.</div><div class="row"><button class="o" onclick="ct=null;render()">Cancel</button><button onclick="startTerm()">Yes, start the new term</button></div>`:`<label for="xn">New term name</label><input id="xn" value="${esc(nName)}"><div class="two2"><div><label for="xs">Opening date</label><input id="xs" type="date" value="${nS}"></div><div><label for="xe">Closing date</label><input id="xe" type="date" value="${dAdd(nS,88)}"></div></div><label for="xd">Fee due date</label><input id="xd" type="date" value="${dAdd(nS,32)}"><p class="m">Use this when a new term begins: invoices and registers start fresh, so no learner is flagged on day one.</p><div class="row"><button onclick="askTerm()">Start new term…</button></div>`}</div></div>`:'';

return '<div class="two"><div class="card"><select onchange="cls=this.value;mk={};render()" aria-label="Class">'+cs.map(c=>'<option'+(c==cls?' selected':'')+'>'+c+'</option>').join('')+'</select><p class="m">'+g.length+' learners · '+TD+'</p>'+(online?'':'<div class="ban off">Offline: registers are saved on this device</div>')+(D.pend.length?'<div class="ban off">'+D.pend.length+' register(s) waiting to sync</div>':'')+'<p><b>Marked '+n+' of '+g.length+'</b></p><div class="bar"><i style="width:'+n/g.length*100+'%;background:var(--g)"></i></div>'+g.map(l=>'<div class="rg"><div class="l"><b>'+l.n+'</b><br><span class="m">Adm. 2024/'+String(l.id%10000).padStart(4,'0')+'</span></div><div class="pa" role="group" aria-label="'+l.n+'">'+['P','A','L','E'].map(c=>'<button class="'+c+(mk[l.id]==c?' s':'')+'" title="'+{P:'Present',A:'Absent',L:'Late',E:'Excused'}[c]+'" onclick="mk['+l.id+']=\''+c+'\';render()">'+c+'</button>').join('')+'</div></div>').join('')+'<div class="row"><button class="o" onclick="g2()">All present</button><button onclick="svR()">Save register</button></div></div><div>'+(sm?'<div class="card"><div class="ban on2">Register saved'+(sm.off?' on this device':'')+'</div><div class="tiles" style="grid-template-columns:repeat(4,1fr)">'+['P','A','L','E'].map(c=>'<div style="background:var(--'+{P:'g',A:'r',L:'a',E:'bl'}[c]+')"><b>'+(sm.c[c]||0)+'</b>'+{P:'Present',A:'Absent',L:'Late',E:'Excused'}[c]+'</div>').join('')+'</div><h3>Early-warning check</h3>'+(sm.al.length?sm.al.map(x=>'<div class="rg"><span>'+pill(x.f)+' <b>'+x.n+'</b><br><span class="m">'+x.t+'</span></span></div>').join(''):'<p class="m">No new alerts from this register.</p>')+'</div>':'<div class="card"><h3>After you save</h3><p class="m">You will see the totals and any Amber or Red flag here. Turn the connection off (top right) to try offline capture.</p></div>')+'</div></div>'+cnForm(D.L.filter(l=>l.c==cls))}
function g2(){D.L.filter(l=>l.c==cls).forEach(l=>mk[l.id]='P');render()}
function svR(){const g=D.L.filter(l=>l.c==cls),m={};g.forEach(l=>m[l.id]=mk[l.id]||'P');if(!online){D.pend.push({c:cls,m});sm={c:cnt(m),al:[],off:1}}else apply(cls,m);mk={};save();render()}
const cnt=m=>Object.values(m).reduce((o,c)=>(o[c]=(o[c]||0)+1,o),{});
function apply(c,m){const al=[];D.L.filter(l=>l.c==c).forEach(l=>{const k=m[l.id];if(!k)return;l.att=(l.d==TD?l.att.slice(0,-1):l.att)+k;l.att=l.att.slice(-20);l.d=TD;const r=risk(l);if(r.f!='GREEN'&&!D.al.some(a=>a.l==l.id&&a.f==r.f&&Date.now()-a.ts<D.cfg.sup*864e5)){const t=msg(l,r);D.al.push({l:l.id,f:r.f,t,ts:Date.now(),st:'Delivered'});sms(l,t);al.push({f:r.f,n:l.n,t:'SMS queued to guardian; class teacher notified.'})}});sm={c:cnt(m),al};save()}
function vRisk(){const c=D.cfg,F=[['days','Absent consecutive school days'],['pct','Or absent in the last 20 school days (%)'],['fee','Fee unpaid (% of term invoice)'],['od','Unpaid after due date (days)'],['sup','Suppress repeat alerts for (days)']];
return '<div class="kp" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'+[['GREEN','Neither condition met','No action'],['AMBER','One condition met','SMS to guardian; class teacher notified'],['RED','Both conditions met','SMS to guardian; Head Teacher notified']].map(x=>'<div class="card">'+pill(x[0])+'<br><b>'+x[1]+'</b><br><span class="m">'+x[2]+'</span></div>').join('')+'</div><div class="two2"><div class="card"><h3>Early-warning rule (editable)</h3>'+F.map(f=>'<label for="c_'+f[0]+'">'+f[1]+'</label><input id="c_'+f[0]+'" type="number" min="1" value="'+c[f[0]]+'">').join('')+'<div class="row"><button onclick="sv()">Save thresholds</button></div></div><div class="card tw"><h3>Alert log</h3><table><tr><th>Time<th>Learner<th>Flag<th>Delivery</tr>'+D.al.slice().reverse().slice(0,10).map(a=>{const i=D.al.indexOf(a);return '<tr><td>'+new Date(a.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<td><b>'+L(a.l).n+'</b><td>'+pill(a.f)+'<td>'+(a.st=='Failed'?'<span class="bad">Failed</span> <button class="o" onclick="rs('+i+')">Resend</button>':'<span class="ok">Delivered</span>')}).join('')+'</table></div></div>'+cnForm(D.L)}
function sv(){['days','pct','fee','od','sup'].forEach(k=>{const v=+$('#c_'+k).value;if(v>0)D.cfg[k]=v});save();T('Thresholds saved');render()}
function rs(i){D.al[i].st='Delivered';sms(L(D.al[i].l),D.al[i].t);save();T('Alert resent');render()}
function vRep(){const cs=[...new Set(D.L.map(l=>l.c))].sort(),ar=D.L.filter(l=>paid(l)<FEE).sort((a,b)=>paid(a)-paid(b));
return '<div class="two2"><div class="card tw"><h3>Attendance by class</h3><table><tr><th>Class<th>Learners<th>Rate</tr>'+cs.map(c=>{const g=D.L.filter(l=>l.c==c),a=g.reduce((s,l)=>s+(l.att.match(/A/g)||[]).length,0);return '<tr><td>'+c+'<td>'+g.length+'<td>'+Math.round((1-a/(g.length*20))*100)+'%'}).join('')+'</table></div><div class="card tw"><h3>Arrears list</h3><table><tr><th>Learner<th>Class<th>Balance</tr>'+ar.map(l=>'<tr><td>'+l.n+'<td>'+l.c+'<td>'+UGX(FEE-paid(l))).join('')+'</table></div></div><div class="card"><h3>At-risk learners and reasons</h3>'+D.L.map(l=>({l,r:risk(l)})).filter(x=>x.r.f!='GREEN').map(x=>'<div class="rg"><span><b>'+x.l.n+'</b> · '+x.l.c+'<br><span class="m">'+msg(x.l,x.r).split('): ')[1]+'</span></span>'+pill(x.r.f)+'</div>').join('')+'</div>'}
function vGuard(){const ks=user&&user.gid?D.L.filter(x=>x.gid==user.gid):[];if(!ks.length)return '<div class="card"><h3>No learner linked yet</h3><p class="m">This account is not linked to a learner. Please contact the school office for the login details sent to you.</p></div>';if(!ks.some(x=>x.id==sel))sel=ks[0].id;const l=L(sel),r=risk(l),s=D.sms.filter(x=>x.l==l.id).slice(-4);
return '<div class="card"><label for="gs">Child</label><select id="gs" onchange="sel=this.value;us=\'Dial *123# to start.\';render()">'+ks.map(x=>'<option value="'+x.id+'"'+(x.id==sel?' selected':'')+'>'+x.n+' · '+x.c+'</option>').join('')+'</select></div><div class="two2"><div><div class="card"><h3>Guardian portal</h3><p class="m">Welcome, '+gd(l)+'</p><div class="two2"><div class="card"><span class="m">Fee balance</span><br><b style="font-size:18px">'+UGX(FEE-paid(l))+'</b></div><div class="card"><span class="m">Attendance this term</span><br><b style="font-size:24px;color:var(--g)">'+Math.round((20-r.n)/20*100)+'%</b></div></div>'+pill(r.f)+'<h3 style="margin-top:14px">Recent alerts and receipts</h3>'+(s.map(x=>'<div class="rg"><span>'+x.t.slice(0,60)+(x.t.length>60?'…':'')+'</span></div>').join('')||'<p class="m">No messages yet.</p>')+'</div></div><div><div class="card"><h3>SMS on a basic phone</h3><div class="lcd">'+(s.map(x=>x.t).join('\n\n')||'No messages.')+'</div></div><div class="card"><h3>USSD query</h3><div class="lcd" style="min-height:120px">'+us+'</div><div class="row"><input id="ui" placeholder="*123# then 1, 2, 3 or 0" onkeydown="if(event.key==\'Enter\')ussd()"><button onclick="ussd()" style="flex:0 0 90px">Send</button></div></div></div></div>'}
function ussd(){const v=$('#ui').value.trim(),l=L(sel),r=risk(l),lp=l.pay[l.pay.length-1],M='SchoolTrack\n1. Fee balance\n2. Attendance\n3. Last receipt\n0. Exit';
us=v=='*123#'?M:v=='1'?l.n+' ('+l.c+')\nBalance: '+UGX(FEE-paid(l))+'\nDue: '+fdS(D.term.due)+'\n0. Back':v=='2'?l.n+'\nAttendance: '+Math.round((20-r.n)/20*100)+'%\nAbsences (last 20 days): '+r.n+'\n0. Back':v=='3'?(lp?lp.rc+'\n'+UGX(lp.a)+' on '+lp.d+'\n0. Back':'No receipts yet.\n0. Back'):v=='0'?(us.includes('SchoolTrack\n1.')?'Goodbye.':M):'Invalid choice. Dial *123#.';render()}
render()
</script></body></html>
