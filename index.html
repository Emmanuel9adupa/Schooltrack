<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SchoolTrack</title>
<style>
:root{--nv:#1F3864;--nv2:#2D4C88;--bg:#F3F6FB;--cd:#fff;--ln:#D5DDEB;--tx:#1B2A41;--mu:#5B6B85;--g:#2E8B57;--a:#E0A020;--r:#C0392B;--bl:#2F6DB5;--in:#fff;--lcd:#E4EEDC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--cd:#18223A;--ln:#2A3858;--tx:#E6ECF8;--mu:#9AA9C4;--in:#101a30;--nv:#0B1220;--nv2:#2D4C88;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1626;--cd:#18223A;--ln:#2A3858;--tx:#E6ECF8;--mu:#9AA9C4;--in:#101a30;--nv:#0B1220;--nv2:#2D4C88;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.sh{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.sb{background:var(--nv);color:#fff;padding:20px 12px}.sb b{font-size:22px;display:block;padding:0 12px}.sb small{color:#B9C6E0;padding:0 12px;display:block;margin-bottom:22px}
.sb a{display:block;padding:10px 12px;border-radius:8px;color:#B9C6E0;cursor:pointer;margin-bottom:6px}.sb a.on{background:var(--nv2);color:#fff;font-weight:600}
.tb{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:var(--cd);border-bottom:1px solid var(--ln);gap:12px;flex-wrap:wrap}.tb h1{font-size:20px;margin:0;color:var(--nv)}@media(prefers-color-scheme:dark){.tb h1{color:#fff}}
.mn{padding:18px 24px;max-width:1200px}.card{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:16px 18px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:15px;color:var(--nv)}@media(prefers-color-scheme:dark){.card h3{color:#fff}}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}.kp .card{margin:0}.kp small,.m{color:var(--mu);font-size:12px}.kp b{display:block;font-size:26px}
.two{display:grid;grid-template-columns:3fr 2fr;gap:14px}.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse}th{background:var(--bg);color:var(--mu);font-size:12px;text-align:left;padding:8px}td{padding:10px 8px;border-top:1px solid var(--ln)}.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:11px;color:#fff;font-size:11px;font-weight:700}.RED{background:var(--r)}.AMBER{background:var(--a)}.GREEN{background:var(--g)}.PARTIAL{background:var(--a)}.PAID{background:var(--g)}.UNPAID{background:var(--r)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tiles div{border-radius:8px;color:#fff;text-align:center;padding:12px 4px;font-size:12px;font-weight:600}.tiles b{display:block;font-size:24px}
input,select{width:100%;padding:9px 10px;border:1px solid #B8C4DA;border-radius:6px;background:var(--in);color:var(--tx);font:inherit}label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:500}input[type=checkbox]{width:auto}
button{font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;border:1px solid var(--nv2);cursor:pointer;background:var(--nv2);color:#fff}button.o{background:transparent;color:var(--nv2)}@media(prefers-color-scheme:dark){button.o{color:#fff;border-color:#6d89c4}}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.row>*{flex:1}.bar{height:16px;background:var(--bg);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
.ban{padding:9px 12px;border-radius:6px;font-weight:600;margin-bottom:12px}.off{background:#FFF4D6;color:#7A5300;border:1px solid #E8C766}.on2{background:#E3F3EA;color:#1E6B40;border:1px solid #9AD1B2}.bad{color:var(--r);font-weight:600;font-size:13px}.ok{color:var(--g);font-weight:600;font-size:13px}
.rg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.rg .l b{font-size:14px}
.pa{display:inline-flex;gap:6px}.pa button{width:34px;padding:7px 0;background:transparent;color:var(--mu);border-color:var(--ln)}.pa button.s{color:#fff;border-color:transparent}.pa .P.s{background:var(--g)}.pa .A.s{background:var(--r)}.pa .L.s{background:var(--a)}.pa .E.s{background:var(--bl)}
.lcd{background:var(--lcd);color:#25361F;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;border-radius:6px;min-height:200px;white-space:pre-wrap;border:6px solid #2B3340}
.lg{min-height:100vh;display:grid;place-items:center;padding:20px}.lg .card{max-width:420px;width:100%}.lg button{width:100%;margin-top:10px}.lg .bk{width:auto;margin:0 0 10px;padding:5px 12px}.lg hr{border:0;border-top:1px solid var(--ln);margin:16px 0 4px}.tb .bk{padding:6px 12px;flex:none}.tb .tt{display:flex;align-items:center;gap:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:8px;z-index:9}
@media(max-width:800px){.sh{grid-template-columns:1fr}.sb{display:flex;gap:6px;overflow-x:auto;padding:10px}.sb b,.sb small{display:none}.sb a{white-space:nowrap;margin:0}.two,.two2{grid-template-columns:1fr}.mn,.tb{padding:12px}}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),UGX=n=>'UGX '+Math.round(n).toLocaleString('en-US'),FEE=450000,DUE=new Date('2026-10-29'),NOW=new Date(),TD=NOW.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
let D,role=null,view='dash',online=true,sel=1,cls='P5 Blue',mk={},sm=null,us='Dial *123# to start.',q='';
const P='P'.repeat(20),tr=k=>P.slice(k)+'A'.repeat(k),sc=k=>{const a=P.split('');for(let i=0;i<k;i++)a[i*3+1]='A';return a.join('')};
const paid=l=>l.pay.reduce((s,p)=>s+p.a,0),L=id=>D.L.find(l=>l.id==id),gd=l=>'Mrs. '+l.n.split(' ')[0];
const risk=l=>{const c=D.cfg,a=l.att,st=a.length-a.replace(/A+$/,'').length,n=(a.match(/A/g)||[]).length,un=(FEE-paid(l))/FEE*100,A_=st>=c.days||n>=c.pct/100*20,F_=un>=c.fee&&(NOW-DUE)/864e5>c.od;return{f:A_&&F_?'RED':A_||F_?'AMBER':'GREEN',st,n,un:Math.round(un),A_,F_}};
const msg=(l,r)=>'SchoolTrack ALERT ('+(r.f=='RED'?'Red':'Amber')+'): '+l.n+' ('+l.c+') '+[r.A_&&'is absent '+(r.st>=D.cfg.days?r.st+' days in a row':r.n+' of the last 20 days'),r.F_&&r.un+'% of fees are overdue'].filter(Boolean).join(' and ')+'. Please contact the school.';
const sms=(l,t)=>D.sms.push({l:l.id,t,ts:Date.now()});
function seed(){const L=[];let id=0;const add=(n,c,p,att)=>{id++;L.push({id,n,c,att,d:'',pay:p?[{a:p,m:'Cash',r:'OPEN-'+id,d:'05 Oct 2026',rc:'R-2026-'+(800+id)}]:[]})};
add('Okello Brian','P5 Blue',180000,tr(3));add('Atim Joan','P5 Blue',369000,tr(3));add('Nakato Grace','P5 Blue',150000,sc(3));['Akello Mary','Byaruhanga Eric','Lubega Ivan','Nansubuga Ruth'].forEach(n=>add(n,'P5 Blue',450000,P));
add('Namukasa Sarah','P7',126000,tr(4));add('Mugisha David','S2 East',202500,sc(6));add('Kato Peter','S1',162000,tr(1));add('Nabirye Esther','P6',315000,sc(4));
const N=['Ssemakula Paul','Namatovu Rose','Opio Samuel','Auma Lydia','Wasswa Henry','Tumusiime Joy','Mukasa Daniel','Achieng Faith','Kiiza Moses','Nalubega Hope'],C=['P1','P2','P3','P4','P6','P7','S1','S2 East','P1','P3'],F=[450000,360000,405000,270000,450000,315000,450000,225000,400000,300000];N.forEach((n,i)=>add(n,C[i],F[i],i%3?P:sc(1)));
D={L,cfg:{days:3,pct:20,fee:50,od:21,sup:7},al:[],sms:[],rc:932,pend:[]};
L.forEach(l=>{const r=risk(l);if(r.f!='GREEN'){const t=msg(l,r);D.al.push({l:l.id,f:r.f,t,ts:Date.now()-(l.n=='Kato Peter'?36e5:8*864e5),st:l.n=='Kato Peter'?'Failed':'Delivered'});sms(l,t)}});return D}
const save=()=>{try{localStorage.setItem('st3',JSON.stringify(D))}catch(e){}};
try{D=JSON.parse(localStorage.getItem('st3'))}catch(e){}if(!D)D=seed();
const T=m=>{$('#t').innerHTML='<div class="toast" role="status">'+m+'</div>';setTimeout(()=>$('#t').innerHTML='',2600)};
const pill=f=>'<span class="pill '+f+'">'+f+'</span>';
const MENU={ht:[['dash','Dashboard'],['learners','Learners'],['risk','Risk & Alerts'],['reports','Reports']],bu:[['dash','Dashboard'],['learners','Learners'],['pay','Fees & Payments'],['reports','Reports']],te:[['att','Attendance'],['learners','Learners']],gu:[['guard','Guardian access']]};
const NAME={ht:'Head Teacher',bu:'Bursar',te:'Class Teacher',gu:'Parent / Guardian'};
function go(v){view=v;render()}
function login(r){role=r;view=MENU[r][0][0];render()}
let au='in',user=null;const AK='st3acc',hp=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(16)};
const accs=()=>{try{return JSON.parse(localStorage.getItem(AK))||[]}catch(e){return[]}},saveAcc=a=>{try{localStorage.setItem(AK,JSON.stringify(a))}catch(e){}},aerr=m=>{$('#ae').innerHTML=m};
function showAuth(m){au=m;render()}
function authView(){const demo=Object.keys(NAME).map(k=>`<button class="o" onclick="login('${k}')">${NAME[k]}</button>`).join('');
if(au=='up')return `<div class="lg"><div class="card"><button class="o bk" onclick="showAuth('in')" aria-label="Back to sign in">&larr; Back to sign in</button><h3 style="font-size:24px;margin:0">Create account</h3><p class="m">Register to use SchoolTrack (prototype: accounts are saved in this browser only).</p><div id="ae" class="bad" role="alert"></div><label for="sn">Full name</label><input id="sn" autocomplete="name"><label for="se">Email</label><input id="se" type="email" autocomplete="email"><label for="sr">I am a</label><select id="sr">${Object.keys(NAME).map(k=>`<option value="${k}">${NAME[k]}</option>`).join('')}</select><label for="sp">Password (at least 6 characters)</label><input id="sp" type="password" autocomplete="new-password"><label for="sp2">Confirm password</label><input id="sp2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')signUp()"><button onclick="signUp()">Create account</button><button class="o" onclick="showAuth('in')">I already have an account</button></div></div>`;
return `<div class="lg"><div class="card"><h3 style="font-size:24px;margin:0">SchoolTrack</h3><p class="m">Fees, attendance and early-warning alerts. Sign in to continue.</p><div id="ae" class="bad" role="alert"></div><label for="ie">Email</label><input id="ie" type="email" autocomplete="username"><label for="ip">Password</label><input id="ip" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')signIn()"><button onclick="signIn()">Sign in</button><button class="o" onclick="showAuth('up')">Create an account</button><hr><p class="m">Or try the prototype with sample data:</p>${demo}</div></div>`}
function signUp(){const n=$('#sn').value.trim(),e=$('#se').value.trim().toLowerCase(),r=$('#sr').value,p=$('#sp').value,p2=$('#sp2').value;
if(!n)return aerr('Enter your full name.');if(!/^\S+@\S+\.\S+$/.test(e))return aerr('Enter a valid email address.');if(p.length<6)return aerr('Password must be at least 6 characters.');if(p!=p2)return aerr('The two passwords do not match.');
const a=accs();if(a.some(x=>x.e==e))return aerr('An account with this email already exists. Please sign in.');
a.push({n,e,r,h:hp(p)});saveAcc(a);user={n,e,r};login(r);T('Account created. Welcome, '+n.split(' ')[0])}
function signIn(){const e=$('#ie').value.trim().toLowerCase(),p=$('#ip').value;if(!e||!p)return aerr('Enter your email and password.');
const u=accs().find(x=>x.e==e&&x.h==hp(p));if(!u)return aerr('Incorrect email or password.');user={n:u.n,e:u.e,r:u.r};login(u.r);T('Signed in. Welcome back, '+u.n.split(' ')[0])}
function signOut(){role=null;user=null;au='in';view='dash';render();T('Signed out')}
function render(){const a=$('#app');if(!role){a.innerHTML=authView();return}
const t=MENU[role].find(m=>m[0]==view)||MENU[role][0],V={dash:vDash,learners:vLearn,pay:vPay,att:vAtt,risk:vRisk,reports:vRep,guard:vGuard}[t[0]];
a.innerHTML='<div class="sh"><nav class="sb"><b>SchoolTrack</b><small>Fees · Attendance · Alerts</small>'+MENU[role].map(m=>'<a tabindex=0 role=button class="'+(m[0]==t[0]?'on':'')+'" onclick="go(\''+m[0]+'\')">'+m[1]+'</a>').join('')+'</nav><div><div class="tb"><div class="tt"><button class="o bk" onclick="signOut()" aria-label="Back to sign in" title="Back to sign in">&larr;</button><h1>'+t[1]+'</h1></div><span class="m"><b style="color:var(--tx)">'+NAME[role]+'</b> · Term 3, 2026 · '+(role=='gu'?'':'<button class="o" onclick="net()">'+(online?'Online':'Offline')+'</button> ')+'<button class="o" onclick="signOut()">Sign out</button></span></div><div class="mn">'+V()+'</div></div></div>'}
function net(){online=!online;if(online&&D.pend.length){D.pend.forEach(p=>apply(p.c,p.m));D.pend=[];save();T('Back online: saved registers synchronised')}render()}
function vDash(){const R=D.L.map(l=>({l,r:risk(l)})),n=f=>R.filter(x=>x.r.f==f).length,tot=D.L.length*FEE,pd=D.L.reduce((s,l)=>s+paid(l),0),pr=D.L.filter(l=>l.att.slice(-1)!='A').length,top=R.filter(x=>x.r.f!='GREEN').sort((a,b)=>(a.r.f=='RED'?0:1)-(b.r.f=='RED'?0:1)).slice(0,6),cs=[...new Set(D.L.map(l=>l.c))].sort();
return '<div class="kp"><div class="card"><small>Learners enrolled</small><b>'+D.L.length+'</b><small>across '+cs.length+' classes</small></div><div class="card"><small>Fees collected</small><b>'+Math.round(pd/tot*100)+'%</b><small>'+UGX(pd)+' of '+UGX(tot)+'</small></div><div class="card"><small>Attendance today</small><b>'+Math.round(pr/D.L.length*100)+'%</b><small>'+pr+' of '+D.L.length+' present</small></div><div class="card"><small>Learners at risk</small><b style="color:var(--r);font-size:19px;padding:7px 0">'+n('RED')+' Red · '+n('AMBER')+' Amber</b><small>needs follow-up</small></div></div><div class="two"><div class="card tw"><h3>Learners at risk today</h3><table><tr><th>Learner<th>Class<th>Absence<th>Fees unpaid<th>Flag</tr>'+top.map(x=>'<tr><td><b>'+x.l.n+'</b><td>'+x.l.c+'<td>'+(x.r.st>=D.cfg.days?x.r.st+' days in a row':x.r.n+' of last 20')+'<td>'+x.r.un+'%<td>'+pill(x.r.f)).join('')+'</table></div><div><div class="card"><h3>Risk summary today</h3><div class="tiles"><div style="background:var(--g)"><b>'+n('GREEN')+'</b>Green</div><div style="background:var(--a)"><b>'+n('AMBER')+'</b>Amber</div><div style="background:var(--r)"><b>'+n('RED')+'</b>Red</div></div><h3>Fee collection by class</h3>'+cs.map(c=>{const g=D.L.filter(l=>l.c==c),p=Math.round(g.reduce((s,l)=>s+paid(l),0)/(g.length*FEE)*100);return '<div class="rg" style="grid-template-columns:70px 1fr 40px"><b>'+c+'</b><div class="bar"><i style="width:'+p+'%;background:var(--'+(p>=70?'g':p>=60?'a':'r')+')"></i></div><span>'+p+'%</span></div>'}).join('')+'</div></div></div>'}
function vLearn(){const f=D.L.filter(l=>(l.n+l.c).toLowerCase().includes(q.toLowerCase()));return '<div class="card"><input placeholder="Search by name or class" value="'+q+'" oninput="q=this.value;render();const i=$(\'input\');i.focus();i.setSelectionRange(99,99)"></div><div class="card tw"><table><tr><th>Learner<th>Class<th>Guardian<th>Balance<th>Attendance<th>Flag</tr>'+f.map(l=>{const r=risk(l);return '<tr><td><b>'+l.n+'</b><td>'+l.c+'<td>'+gd(l)+'<td>'+UGX(FEE-paid(l))+'<td>'+Math.round((20-r.n)/20*100)+'%<td>'+pill(r.f)}).join('')+'</table></div>'+(role=='ht'||role=='bu'?'<div class="card"><h3>Register a learner</h3><div class="two2"><div><label>Full name</label><input id="nn"></div><div><label>Class</label><input id="nc" value="P5 Blue"></div></div><div class="row"><button onclick="addL()">Register learner</button></div></div>':'')}
function addL(){const n=$('#nn').value.trim();if(!n)return T('Enter the learner’s full name.');D.L.push({id:Date.now(),n,c:$('#nc').value.trim()||'P1',att:P,d:'',pay:[]});save();T('Learner registered');q='';render()}
function vPay(){const l=L(sel),b=FEE-paid(l),r=risk(l),lp=l.pay[l.pay.length-1],rec=D.L.flatMap(x=>x.pay.map(p=>({n:x.n,p}))).filter(x=>!x.p.r.startsWith('OPEN')).slice(-3).reverse();
return '<div class="two"><div><div class="card"><h3>1 Select learner</h3><select onchange="sel=this.value;render()">'+D.L.map(x=>'<option value="'+x.id+'"'+(x.id==sel?' selected':'')+'>'+x.n+' · '+x.c+'</option>').join('')+'</select><p class="m">Class '+l.c+' · Guardian: '+gd(l)+' · SMS consent recorded</p></div><div class="card"><h3>2 Invoice: Term 3, 2026</h3><div class="two2"><div><span class="m">Total invoice</span><br><b style="font-size:18px">'+UGX(FEE)+'</b></div><div><span class="m">Balance</span><br><b style="font-size:18px;color:var(--r)">'+UGX(b)+'</b></div></div><div class="row" style="justify-content:flex-start">'+pill(b==0?'PAID':b==FEE?'UNPAID':'PARTIAL')+' '+pill(r.f)+'<span class="m">Due 29 Oct 2026</span></div></div><div class="card"><h3>3 Record payment</h3><div class="two2"><div><label>Amount (UGX)</label><input id="pa" type="number" value="'+Math.min(b,150000)+'"></div><div><label>Payment method</label><select id="pm"><option>Mobile money<option>Cash<option>Bank</select></div><div><label>Reference number</label><input id="pr" placeholder="e.g. MM-48271930" oninput="chk()"></div><div><label>Payment date</label><input value="'+TD+'" readonly></div></div><p id="rm" class="m"></p><label style="display:flex;gap:8px;align-items:center"><input id="ps" type="checkbox" checked> Send receipt SMS to guardian</label><div class="row"><button class="o" onclick="render()" style="flex:0 0 100px">Cancel</button><button onclick="pay()">Save payment and print receipt</button></div></div></div><div><div class="card"><h3 style="text-align:center">RECEIPT</h3>'+(lp?'<p class="m" style="text-align:center">Sample Primary School, Kampala</p>'+[['Receipt no.',lp.rc],['Date',lp.d],['Received from',gd(l)],['Learner',l.n+', '+l.c],['Method',lp.m],['Reference',lp.r]].map(x=>'<div class="rg"><span class="m">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'<div class="rg"><b>Amount received</b><b style="font-size:20px;color:var(--nv2)">'+UGX(lp.a)+'</b></div><div class="rg"><span class="m">Balance after payment</span><b>'+UGX(b)+'</b></div><p class="m">Payments cannot be edited; corrections are reversing entries.</p><button class="o" onclick="print()">Print receipt</button>':'<p class="m">No payment yet for this learner. Save a payment to see its receipt here.</p>')+'</div><div class="card"><h3>Recent payments</h3>'+(rec.map(x=>'<div class="rg"><span>'+x.n+' · '+x.p.m+'</span><b>'+UGX(x.p.a)+'</b></div>').join('')||'<p class="m">No payments recorded in this session.</p>')+'</div></div></div>'}
function chk(){const r=$('#pr').value.trim(),u=D.L.some(x=>x.pay.some(p=>p.r==r));$('#rm').innerHTML=r?(u?'<span class="bad">This reference was already used.</span>':'<span class="ok">✓ Reference is unique</span>'):''}
function pay(){const l=L(sel),a=+$('#pa').value,r=$('#pr').value.trim(),m=$('#pm').value,b=FEE-paid(l),e=x=>($('#rm').innerHTML='<span class="bad">'+x+'</span>');
if(!(a>0))return e('Enter an amount greater than zero.');if(!r)return e('Enter the reference number.');if(D.L.some(x=>x.pay.some(p=>p.r==r)))return e('This reference was already used. Check the number and try again.');if(a>b)return e('The amount is more than the balance of '+UGX(b)+'.');
const p={a,m,r,d:TD,rc:'R-2026-'+D.rc++};l.pay.push(p);if($('#ps').checked)sms(l,'SchoolTrack: Receipt '+p.rc+'. '+UGX(a)+' received for '+l.n+' ('+l.c+'). Balance '+UGX(FEE-paid(l))+'. Thank you.');save();T('Payment saved');render()}
function vAtt(){const cs=[...new Set(D.L.map(l=>l.c))].sort(),g=D.L.filter(l=>l.c==cls),n=Object.keys(mk).filter(k=>g.some(l=>l.id==k)).length;
return '<div class="two"><div class="card"><select onchange="cls=this.value;mk={};render()" aria-label="Class">'+cs.map(c=>'<option'+(c==cls?' selected':'')+'>'+c+'</option>').join('')+'</select><p class="m">'+g.length+' learners · '+TD+'</p>'+(online?'':'<div class="ban off">Offline: registers are saved on this device</div>')+(D.pend.length?'<div class="ban off">'+D.pend.length+' register(s) waiting to sync</div>':'')+'<p><b>Marked '+n+' of '+g.length+'</b></p><div class="bar"><i style="width:'+n/g.length*100+'%;background:var(--g)"></i></div>'+g.map(l=>'<div class="rg"><div class="l"><b>'+l.n+'</b><br><span class="m">Adm. 2024/'+String(l.id%10000).padStart(4,'0')+'</span></div><div class="pa" role="group" aria-label="'+l.n+'">'+['P','A','L','E'].map(c=>'<button class="'+c+(mk[l.id]==c?' s':'')+'" title="'+{P:'Present',A:'Absent',L:'Late',E:'Excused'}[c]+'" onclick="mk['+l.id+']=\''+c+'\';render()">'+c+'</button>').join('')+'</div></div>').join('')+'<div class="row"><button class="o" onclick="g2()">All present</button><button onclick="svR()">Save register</button></div></div><div>'+(sm?'<div class="card"><div class="ban on2">Register saved'+(sm.off?' on this device':'')+'</div><div class="tiles" style="grid-template-columns:repeat(4,1fr)">'+['P','A','L','E'].map(c=>'<div style="background:var(--'+{P:'g',A:'r',L:'a',E:'bl'}[c]+')"><b>'+(sm.c[c]||0)+'</b>'+{P:'Present',A:'Absent',L:'Late',E:'Excused'}[c]+'</div>').join('')+'</div><h3>Early-warning check</h3>'+(sm.al.length?sm.al.map(x=>'<div class="rg"><span>'+pill(x.f)+' <b>'+x.n+'</b><br><span class="m">'+x.t+'</span></span></div>').join(''):'<p class="m">No new alerts from this register.</p>')+'</div>':'<div class="card"><h3>After you save</h3><p class="m">You will see the totals and any Amber or Red flag here. Turn the connection off (top right) to try offline capture.</p></div>')+'</div></div>'}
function g2(){D.L.filter(l=>l.c==cls).forEach(l=>mk[l.id]='P');render()}
function svR(){const g=D.L.filter(l=>l.c==cls),m={};g.forEach(l=>m[l.id]=mk[l.id]||'P');if(!online){D.pend.push({c:cls,m});sm={c:cnt(m),al:[],off:1}}else apply(cls,m);mk={};save();render()}
const cnt=m=>Object.values(m).reduce((o,c)=>(o[c]=(o[c]||0)+1,o),{});
function apply(c,m){const al=[];D.L.filter(l=>l.c==c).forEach(l=>{const k=m[l.id];if(!k)return;l.att=(l.d==TD?l.att.slice(0,-1):l.att)+k;l.att=l.att.slice(-20);l.d=TD;const r=risk(l);if(r.f!='GREEN'&&!D.al.some(a=>a.l==l.id&&a.f==r.f&&Date.now()-a.ts<D.cfg.sup*864e5)){const t=msg(l,r);D.al.push({l:l.id,f:r.f,t,ts:Date.now(),st:'Delivered'});sms(l,t);al.push({f:r.f,n:l.n,t:'SMS queued to guardian; class teacher notified.'})}});sm={c:cnt(m),al};save()}
function vRisk(){const c=D.cfg,F=[['days','Absent consecutive school days'],['pct','Or absent in the last 20 school days (%)'],['fee','Fee unpaid (% of term invoice)'],['od','Unpaid after due date (days)'],['sup','Suppress repeat alerts for (days)']];
return '<div class="kp" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">'+[['GREEN','Neither condition met','No action'],['AMBER','One condition met','SMS to guardian; class teacher notified'],['RED','Both conditions met','SMS to guardian; Head Teacher notified']].map(x=>'<div class="card">'+pill(x[0])+'<br><b>'+x[1]+'</b><br><span class="m">'+x[2]+'</span></div>').join('')+'</div><div class="two2"><div class="card"><h3>Early-warning rule (editable)</h3>'+F.map(f=>'<label for="c_'+f[0]+'">'+f[1]+'</label><input id="c_'+f[0]+'" type="number" min="1" value="'+c[f[0]]+'">').join('')+'<div class="row"><button onclick="sv()">Save thresholds</button></div></div><div class="card tw"><h3>Alert log</h3><table><tr><th>Time<th>Learner<th>Flag<th>Delivery</tr>'+D.al.slice().reverse().slice(0,10).map(a=>{const i=D.al.indexOf(a);return '<tr><td>'+new Date(a.ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'<td><b>'+L(a.l).n+'</b><td>'+pill(a.f)+'<td>'+(a.st=='Failed'?'<span class="bad">Failed</span> <button class="o" onclick="rs('+i+')">Resend</button>':'<span class="ok">Delivered</span>')}).join('')+'</table></div></div>'}
function sv(){['days','pct','fee','od','sup'].forEach(k=>{const v=+$('#c_'+k).value;if(v>0)D.cfg[k]=v});save();T('Thresholds saved');render()}
function rs(i){D.al[i].st='Delivered';sms(L(D.al[i].l),D.al[i].t);save();T('Alert resent');render()}
function vRep(){const cs=[...new Set(D.L.map(l=>l.c))].sort(),ar=D.L.filter(l=>paid(l)<FEE).sort((a,b)=>paid(a)-paid(b));
return '<div class="two2"><div class="card tw"><h3>Attendance by class</h3><table><tr><th>Class<th>Learners<th>Rate</tr>'+cs.map(c=>{const g=D.L.filter(l=>l.c==c),a=g.reduce((s,l)=>s+(l.att.match(/A/g)||[]).length,0);return '<tr><td>'+c+'<td>'+g.length+'<td>'+Math.round((1-a/(g.length*20))*100)+'%'}).join('')+'</table></div><div class="card tw"><h3>Arrears list</h3><table><tr><th>Learner<th>Class<th>Balance</tr>'+ar.map(l=>'<tr><td>'+l.n+'<td>'+l.c+'<td>'+UGX(FEE-paid(l))).join('')+'</table></div></div><div class="card"><h3>At-risk learners and reasons</h3>'+D.L.map(l=>({l,r:risk(l)})).filter(x=>x.r.f!='GREEN').map(x=>'<div class="rg"><span><b>'+x.l.n+'</b> · '+x.l.c+'<br><span class="m">'+msg(x.l,x.r).split('): ')[1]+'</span></span>'+pill(x.r.f)+'</div>').join('')+'</div>'}
function vGuard(){const l=L(sel),r=risk(l),s=D.sms.filter(x=>x.l==l.id).slice(-4);
return '<div class="card"><label for="gs">Child</label><select id="gs" onchange="sel=this.value;us=\'Dial *123# to start.\';render()">'+D.L.map(x=>'<option value="'+x.id+'"'+(x.id==sel?' selected':'')+'>'+x.n+' · '+x.c+'</option>').join('')+'</select></div><div class="two2"><div><div class="card"><h3>Guardian portal</h3><p class="m">Welcome, '+gd(l)+'</p><div class="two2"><div class="card"><span class="m">Fee balance</span><br><b style="font-size:18px">'+UGX(FEE-paid(l))+'</b></div><div class="card"><span class="m">Attendance this term</span><br><b style="font-size:24px;color:var(--g)">'+Math.round((20-r.n)/20*100)+'%</b></div></div>'+pill(r.f)+'<h3 style="margin-top:14px">Recent alerts and receipts</h3>'+(s.map(x=>'<div class="rg"><span>'+x.t.slice(0,60)+(x.t.length>60?'…':'')+'</span></div>').join('')||'<p class="m">No messages yet.</p>')+'</div></div><div><div class="card"><h3>SMS on a basic phone</h3><div class="lcd">'+(s.map(x=>x.t).join('\n\n')||'No messages.')+'</div></div><div class="card"><h3>USSD query</h3><div class="lcd" style="min-height:120px">'+us+'</div><div class="row"><input id="ui" placeholder="*123# then 1, 2, 3 or 0" onkeydown="if(event.key==\'Enter\')ussd()"><button onclick="ussd()" style="flex:0 0 90px">Send</button></div></div></div></div>'}
function ussd(){const v=$('#ui').value.trim(),l=L(sel),r=risk(l),lp=l.pay[l.pay.length-1],M='SchoolTrack\n1. Fee balance\n2. Attendance\n3. Last receipt\n0. Exit';
us=v=='*123#'?M:v=='1'?l.n+' ('+l.c+')\nBalance: '+UGX(FEE-paid(l))+'\nDue: 29 Oct 2026\n0. Back':v=='2'?l.n+'\nAttendance: '+Math.round((20-r.n)/20*100)+'%\nAbsences (last 20 days): '+r.n+'\n0. Back':v=='3'?(lp?lp.rc+'\n'+UGX(lp.a)+' on '+lp.d+'\n0. Back':'No receipts yet.\n0. Back'):v=='0'?(us.includes('SchoolTrack\n1.')?'Goodbye.':M):'Invalid choice. Dial *123#.';render()}
render()
</script></body></html>
